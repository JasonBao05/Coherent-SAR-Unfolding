<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">DP-JMRNet</title>
  <desc id="desc">Phase-preserving bitemporal SAR reconstruction with fixed-mask deep unfolding</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102c48"/>
      <stop offset="1" stop-color="#133a53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de2c5"/>
      <stop offset="1" stop-color="#59a8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <g opacity="0.16" stroke="#8ad8ff" fill="none">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200"/>
    <path d="M80 0V320M160 0V320M240 0V320M320 0V320M400 0V320M480 0V320M560 0V320M640 0V320M720 0V320M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320"/>
  </g>

  <g transform="translate(105 160)" fill="none" stroke="url(#accent)">
    <circle r="88" opacity="0.22"/>
    <circle r="60" opacity="0.35"/>
    <circle r="31" opacity="0.55"/>
    <path d="M0 0L72-51" stroke-width="3" filter="url(#glow)"/>
    <circle cx="72" cy="-51" r="6" fill="#4de2c5" stroke="none" filter="url(#glow)"/>
    <path d="M-98 79C-54 59-12 54 31 60C58 64 81 72 104 88" opacity="0.65" stroke-width="2"/>
  </g>

  <g transform="translate(270 57)">
    <text x="0" y="79" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="1">DP-JMRNet</text>
    <rect x="0" y="101" width="655" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="146" fill="#b9d9ea" font-family="Segoe UI,Arial,sans-serif" font-size="24">Phase-preserving bitemporal SAR reconstruction</text>
    <text x="0" y="181" fill="#7fded2" font-family="Segoe UI,Arial,sans-serif" font-size="19">FIXED MASK  ·  MATRIX-FREE PHYSICS  ·  SELECTIVE UNFOLDING</text>
  </g>

  <g transform="translate(1010 67)" fill="none" stroke="#68cdeb" stroke-width="2">
    <path d="M0 0C45 22 68 54 68 96S45 170 0 192" opacity="0.25"/>
    <path d="M23 17C56 35 72 62 72 96S56 157 23 175" opacity="0.45"/>
    <path d="M48 38C70 51 81 70 81 96S70 141 48 154" opacity="0.75"/>
    <circle cx="86" cy="96" r="6" fill="#4de2c5" stroke="none" filter="url(#glow)"/>
  </g>
</svg>
